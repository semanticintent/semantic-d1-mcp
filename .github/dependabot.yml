# Dormant repo: security updates only.
# A zero PR limit stops routine version-update PRs; Dependabot security
# updates still open PRs when a vulnerable dependency has a fix.
version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "automated"
    ignore:
      # Ignore dotenv updates - version 17.x breaks MCP stdio with banner output
      - dependency-name: "dotenv"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Keep GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    labels:
      - "ci"
      - "dependencies"
